services:
  - type: web
    name: lifehackcorvex-api-reucci
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ECOLINGS_DATABASE_URL
        sync: false
      - key: ECOLINGS_FRONTEND_ORIGINS
        value: https://lifehackcorvex-reucci.onrender.com

  - type: web
    name: lifehackcorvex-reucci
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE
        value: https://lifehackcorvex-api-reucci.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
