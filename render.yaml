services:
  - type: web
    name: lifehackcorvex-api-reucci
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ECOLINGS_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_DYNAMIC_QUESTS
        value: true
      - key: OPENAI_DIALOGUE
        value: true
      - key: OPENAI_DAILY_BUDGET_USD
        value: 2.00
      - key: ECOLINGS_FRONTEND_ORIGINS
        value: https://ecolings.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: lifehackcorvex-reucci
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE
        value: https://ecolings-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
